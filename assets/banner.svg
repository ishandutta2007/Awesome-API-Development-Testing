<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glowing Node Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        fill: url(#primaryGrad);
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 20px;
        fill: #94a3b8;
      }
      .badge-label {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 13px;
        font-weight: 600;
        fill: #e2e8f0;
      }
      
      /* Dynamic Animations (Background Ambient Elements) */
      @keyframes pulseBeam {
        0% { stroke-dashoffset: 400; opacity: 0.2; }
        50% { opacity: 0.8; }
        100% { stroke-dashoffset: 0; opacity: 0.2; }
      }
      @keyframes floatParticle1 {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
        50% { transform: translateY(-25px) translateX(15px); opacity: 0.7; }
        100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      }
      @keyframes floatParticle2 {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
        50% { transform: translateY(20px) translateX(-20px); opacity: 0.6; }
        100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      }
      @keyframes pingRing {
        0% { r: 12px; opacity: 0.8; }
        100% { r: 35px; opacity: 0; }
      }
      
      .animated-circuit {
        stroke-dasharray: 20, 10;
        animation: pulseBeam 12s linear infinite;
      }
      .p1 { animation: floatParticle1 7s ease-in-out infinite; }
      .p2 { animation: floatParticle2 9s ease-in-out infinite; }
      .ping-pulse { animation: pingRing 3s cubic-bezier(0, 0.2, 0.8, 1) infinite; }
    </style>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1200" height="360" rx="20" fill="url(#bgGradient)" stroke="#1e293b" stroke-width="2"/>

  <!-- Dynamic / Animated Circuit Lines in Deep Background -->
  <g opacity="0.4">
    <!-- Grid Pattern Lines -->
    <line x1="0" y1="90" x2="1200" y2="90" stroke="#334155" stroke-width="1" stroke-dasharray="4 8" />
    <line x1="0" y1="180" x2="1200" y2="180" stroke="#334155" stroke-width="1" stroke-dasharray="4 8" />
    <line x1="0" y1="270" x2="1200" y2="270" stroke="#334155" stroke-width="1" stroke-dasharray="4 8" />
    <line x1="300" y1="0" x2="300" y2="360" stroke="#334155" stroke-width="1" stroke-dasharray="4 8" />
    <line x1="600" y1="0" x2="600" y2="360" stroke="#334155" stroke-width="1" stroke-dasharray="4 8" />
    <line x1="900" y1="0" x2="900" y2="360" stroke="#334155" stroke-width="1" stroke-dasharray="4 8" />

    <!-- Animated Data Highways -->
    <path class="animated-circuit" d="M 50 40 L 450 40 L 520 110 L 980 110 L 1050 180 L 1150 180" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="animated-circuit" d="M 1150 320 L 780 320 L 720 260 L 250 260 L 180 200 L 50 200" fill="none" stroke="#818cf8" stroke-width="2" style="animation-duration: 9s; animation-direction: reverse;" />
  </g>

  <!-- Animated Ambient Floating Nodes (Deep Background) -->
  <g class="p1">
    <circle cx="160" cy="80" r="45" fill="#38bdf8" opacity="0.12" filter="url(#glow)"/>
    <circle cx="1060" cy="270" r="55" fill="#c084fc" opacity="0.12" filter="url(#glow)"/>
  </g>
  <g class="p2">
    <circle cx="1040" cy="70" r="40" fill="#818cf8" opacity="0.15" filter="url(#glow)"/>
    <circle cx="120" cy="290" r="50" fill="#38bdf8" opacity="0.1" filter="url(#glow)"/>
  </g>

  <!-- Animated Radar Pulse Indicators on Key Gateway Nodes -->
  <g transform="translate(1050, 180)">
    <circle class="ping-pulse" cx="0" cy="0" fill="none" stroke="#38bdf8" stroke-width="2" />
    <circle cx="0" cy="0" r="6" fill="#38bdf8" />
  </g>
  <g transform="translate(180, 200)">
    <circle class="ping-pulse" cx="0" cy="0" fill="none" stroke="#818cf8" stroke-width="2" style="animation-delay: 1.5s;" />
    <circle cx="0" cy="0" r="6" fill="#818cf8" />
  </g>

  <!-- FOREGROUND CONTENT: Header, Subtitle, and Feature Tags (Rock solid foreground clarity) -->
  <g transform="translate(600, 115)">
    <!-- Main Title -->
    <text class="title-text" text-anchor="middle" y="0">⚡ Awesome API Development &amp; Testing</text>
    
    <!-- Subtitle -->
    <text class="subtitle-text" text-anchor="middle" y="44">The Curated Matrix of Modern SaaS Platforms &amp; Git-Native Open-Source Tooling</text>
  </g>

  <!-- High-contrast Categorical Badges / Indicator Pills (Foreground) -->
  <g transform="translate(600, 225)">
    <!-- Pill 1: REST & GraphQL -->
    <g transform="translate(-360, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="-60" cy="0" r="4" fill="#38bdf8" />
      <text class="badge-label" text-anchor="middle" x="8" y="5">REST &amp; GraphQL</text>
    </g>

    <!-- Pill 2: Contract Testing -->
    <g transform="translate(-120, 0)">
      <rect x="-95" y="-18" width="190" height="36" rx="18" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
      <circle cx="-70" cy="0" r="4" fill="#818cf8" />
      <text class="badge-label" text-anchor="middle" x="10" y="5">Contract Testing</text>
    </g>

    <!-- Pill 3: Git-Native / Local-First -->
    <g transform="translate(130, 0)">
      <rect x="-100" y="-18" width="200" height="36" rx="18" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" />
      <circle cx="-75" cy="0" r="4" fill="#a855f7" />
      <text class="badge-label" text-anchor="middle" x="10" y="5">Git-Native Workflows</text>
    </g>

    <!-- Pill 4: Mocking & Performance -->
    <g transform="translate(370, 0)">
      <rect x="-95" y="-18" width="190" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="-70" cy="0" r="4" fill="#38bdf8" />
      <text class="badge-label" text-anchor="middle" x="10" y="5">Mocking &amp; Load Tests</text>
    </g>
  </g>

  <!-- Bottom Accent Status Line -->
  <rect x="350" y="295" width="500" height="3" rx="1.5" fill="url(#primaryGrad)" opacity="0.8" />
</svg>
